name: SafeSpace Verify and Deploy

# Verify the full-stack source, then deploy a separate guest-only static
# artifact to GitHub Pages. Authenticated server APIs are NOT deployed there.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safespace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: CAD and spatial unit tests
        run: npm test
      - name: Build Next.js server app
        run: npm run build
      - name: Browser guest end-to-end smoke (Chrome)
        run: npm run test:browser:guest

  pages-export:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build isolated static guest website
        run: npm run build:pages
        env:
          NEXT_PUBLIC_GEMINI_GATEWAY_URL: ${{ vars.NEXT_PUBLIC_GEMINI_GATEWAY_URL || '' }}
      - name: Smoke test deployed artifact locally
        run: node scripts/smoke-pages-browser.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy-pages:
    needs: pages-export
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy guest website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

