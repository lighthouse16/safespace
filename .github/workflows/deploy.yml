name: SafeSpace Full-Stack Build Check

# Build and verify the Next.js server application, including account-free
# browser E2E. Deploy only via a separately approved server-capable host.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safespace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: CAD and spatial unit tests
        run: npx tsx --test tests/frontend-v2-cad-recovery.test.ts tests/spatial-parity.test.ts
      - name: Build Next.js server app
        run: npm run build
      - name: Browser guest end-to-end smoke (Chrome)
        run: npm run test:browser:guest

# No deployment job; GitHub Pages cannot run Next.js API routes.
